<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busya - Inicio</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="icon" href="autobus-escolar.ico" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">🚌BusYa</div>
            <p class="subtitle">¿Qué colectivo vas a tomar hoy?<br>V10</p>
        </header>

        <main class="selection-container">
            <h2>Opciones de Consulta</h2>
            
            <div class="menu-lineas">
                <!-- Botones directos de las Líneas -->
                <button class="linea-card" onclick="seleccionarLinea('linea_a')">
                    <div class="linea-badge badge-a">A</div>
                    <div class="linea-info">
                        <h3>Línea A</h3>
                        <p>Facultad ↔ Ate 2</p>
                    </div>
                    <span class="arrow">➔</span>
                </button>

                <button class="linea-card" onclick="seleccionarLinea('linea_e')">
                    <div class="linea-badge badge-e">E</div>
                    <div class="linea-info">
                        <h3>Línea E</h3>
                        <p>M. Ernst ↔ La Ribera</p>
                    </div>
                    <span class="arrow">➔</span>
                </button>

                <button class="linea-card" onclick="seleccionarLinea('linea_este')">
                    <div class="linea-badge badge-este">Este</div>
                    <div class="linea-info">
                        <h3>Línea Zona Este</h3>
                        <p>Pellegrini ↔ Htal. Eva Perón</p>
                    </div>
                    <span class="arrow">➔</span>
                </button>

                <button class="linea-card" onclick="seleccionarLinea('linea_oeste')">
                    <div class="linea-badge badge-oeste">Oeste</div>
                    <div class="linea-info">
                        <h3>Línea Zona Oeste</h3>
                        <p>Terminal ↔ Policlínico</p>
                    </div>
                    <span class="arrow">➔</span>
                </button>

                <!-- Botón "¿Cómo llegar?" -->
                <a href="como_llegar.html" class="mapa-link-container">
                    <button class="mapa-card" style="border-left: 5px solid #2e7d32;">
                        <div class="mapa-badge" style="background-color: #2e7d32; color: white;">GPS</div>
                        <div class="mapa-info">
                            <h3>📍 ¿CÓMO LLEGAR?</h3>
                            <p>Ruta a pie y tiempo de viaje estimado</p>
                        </div>
                        <span class="mapa-arrow">➔</span>
                    </button>
                </a>
            </div>
        </main>

        <footer class="app-footer">
            <a href="chofer.html" class="driver-access-link">⚙️ Panel de Control</a>
        </footer>
    </div>

    <!-- MODAL: Pase Estudiantil -->
    <div id="modal-estudiante" class="modal-estudiante-overlay hidden" onclick="cerrarModalEstudiante(event)">
        <div class="modal-estudiante-content">
            <button class="modal-estudiante-cerrar" onclick="document.getElementById('modal-estudiante').classList.add('hidden')">×</button>
            <div class="modal-estudiante-icono">🎓</div>
            <h3 id="modal-estudiante-titulo">Pase Estudiantil</h3>
            <p id="modal-estudiante-mensaje">Cargando estado...</p>
            <div class="modal-estudiante-nota">
                * Sujeto a cambios o disposiciones excepcionales de la Municipalidad o la Empresa.
            </div>
        </div>
    </div>

    <!-- Botón Flotante Estudiante -->
    <button id="btn-estudiante-flotante" class="boton-estudiante-circular" onclick="abrirModalEstudiante()">🎓</button>
    
    <!-- Botón Crítica -->
    <a href="https://forms.gle/hDyzfmBvpZBaJvy77" target="_blank" class="boton-critica-circular" title="Dejanos tu crítica">📝</a>

    <!-- Scripts de la aplicación -->
    <script src="script/dias.js"></script>
    <script src="script/app.js"></script>
</body>
</html>
